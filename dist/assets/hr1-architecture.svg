<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">HR1 governed evidence flow</title>
  <desc id="desc">A clean five-stage architecture diagram. Source systems pass evidence through an API boundary, deterministic rules and bounded AI, human review, and an audited outcome. Connector arrows appear only between cards.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .eyebrow{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#047857}.title{font:700 34px Arial,sans-serif;fill:#102033}.subtitle{font:400 17px Arial,sans-serif;fill:#53657a}.card{fill:#fff;stroke:#cbd8e4;stroke-width:2}.stage{font:800 13px Arial,sans-serif;letter-spacing:1.5px;fill:#64748b}.heading{font:700 21px Arial,sans-serif;fill:#102033}.body{font:400 16px Arial,sans-serif;fill:#30465d}.number{font:800 15px Arial,sans-serif;fill:#fff}.ruleHead{font:700 18px Arial,sans-serif;fill:#064e3b}.ruleBody{font:400 15px Arial,sans-serif;fill:#356559}.footer{font:400 13px Arial,sans-serif;fill:#64748b}.arrow{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>
  <text x="60" y="55" class="eyebrow">HR1 GOVERNED AI INTEGRATION</text>
  <text x="60" y="100" class="title">Evidence moves forward. Authority stays with people.</text>
  <text x="60" y="132" class="subtitle">Five clear stages with one accountable decision boundary.</text>

  <g transform="translate(60 180)">
    <rect width="240" height="300" rx="14" class="card"/>
    <rect width="240" height="8" rx="4" fill="#64748b"/>
    <circle cx="38" cy="48" r="20" fill="#64748b"/><text x="38" y="54" text-anchor="middle" class="number">1</text>
    <text x="24" y="92" class="stage">AUTHORITATIVE DATA</text>
    <text x="24" y="126" class="heading">Source systems</text>
    <text x="24" y="166" class="body">SIS, LMS and CRM</text>
    <text x="24" y="194" class="body">Approved APIs only</text>
    <text x="24" y="238" class="stage">BOUNDARY</text>
    <text x="24" y="268" class="body">Read evidence</text>
  </g>

  <path d="M310 330H350" class="arrow"/>

  <g transform="translate(360 180)">
    <rect width="240" height="300" rx="14" class="card"/>
    <rect width="240" height="8" rx="4" fill="#2563eb"/>
    <circle cx="38" cy="48" r="20" fill="#2563eb"/><text x="38" y="54" text-anchor="middle" class="number">2</text>
    <text x="24" y="92" class="stage">CONTROLLED ENTRY</text>
    <text x="24" y="126" class="heading">API + orchestration</text>
    <text x="24" y="166" class="body">Authenticate and route</text>
    <text x="24" y="194" class="body">Validate and normalize</text>
    <text x="24" y="238" class="stage">BOUNDARY</text>
    <text x="24" y="268" class="body">Reject invalid input</text>
  </g>

  <path d="M610 330H650" class="arrow"/>

  <g transform="translate(660 180)">
    <rect width="240" height="300" rx="14" class="card"/>
    <rect width="240" height="8" rx="4" fill="#7c3aed"/>
    <circle cx="38" cy="48" r="20" fill="#7c3aed"/><text x="38" y="54" text-anchor="middle" class="number">3</text>
    <text x="24" y="92" class="stage">BOUNDED ANALYSIS</text>
    <text x="24" y="126" class="heading">Rules, then AI</text>
    <text x="24" y="166" class="body">Exact comparison first</text>
    <text x="24" y="194" class="body">Read-only AI tools</text>
    <text x="24" y="238" class="stage">BOUNDARY</text>
    <text x="24" y="268" class="body">Recommendation only</text>
  </g>

  <path d="M910 330H950" class="arrow"/>

  <g transform="translate(960 180)">
    <rect width="240" height="300" rx="14" class="card"/>
    <rect width="240" height="8" rx="4" fill="#ea580c"/>
    <circle cx="38" cy="48" r="20" fill="#ea580c"/><text x="38" y="54" text-anchor="middle" class="number">4</text>
    <text x="24" y="92" class="stage">ACCOUNTABLE CONTROL</text>
    <text x="24" y="126" class="heading">Human decision</text>
    <text x="24" y="166" class="body">Accept, reject, escalate</text>
    <text x="24" y="194" class="body">Rationale required</text>
    <text x="24" y="238" class="stage">BOUNDARY</text>
    <text x="24" y="268" class="body">Authorized reviewer</text>
  </g>

  <path d="M1210 330H1250" class="arrow"/>

  <g transform="translate(1260 180)">
    <rect width="240" height="300" rx="14" class="card"/>
    <rect width="240" height="8" rx="4" fill="#047857"/>
    <circle cx="38" cy="48" r="20" fill="#047857"/><text x="38" y="54" text-anchor="middle" class="number">5</text>
    <text x="24" y="92" class="stage">GOVERNED OUTCOME</text>
    <text x="24" y="126" class="heading">Audit + analytics</text>
    <text x="24" y="166" class="body">Decision history</text>
    <text x="24" y="194" class="body">Operational reporting</text>
    <text x="24" y="238" class="stage">BOUNDARY</text>
    <text x="24" y="268" class="body">Traceable outcome</text>
  </g>

  <rect x="60" y="540" width="1440" height="105" rx="14" fill="#ecfdf5" stroke="#a7d9cd" stroke-width="2"/>
  <circle cx="105" cy="592" r="22" fill="#047857"/><path d="M95 592l7 7 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="580" class="ruleHead">One rule across every stage</text>
  <text x="145" y="610" class="ruleBody">Source systems remain authoritative. AI can recommend, but only an authorized person can approve an outcome.</text>

  <text x="60" y="705" class="footer">Illustrative architecture. Production integrations require approved interfaces, identity controls, data minimization, monitoring, and accountable owners.</text>
</svg>
