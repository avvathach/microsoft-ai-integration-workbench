<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Structurizr-style HR1 governed enterprise integration architecture</title>
  <desc id="desc">PeopleSoft, Banner, a learning platform, CRM and Azure SQL connect through an API integration boundary to a governed SharePoint data layer. Rules and AI assist exceptions, while authorized people make decisions. Microsoft identity, secrets, logging and alerts protect every interaction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0f6b78"/></marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102033}.subtitle{font:400 17px Arial,sans-serif;fill:#475569}.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#0f6b78}.head{font:700 20px Arial,sans-serif;fill:#102033}.body{font:600 14px Arial,sans-serif;fill:#243447}.small{font:400 12px Arial,sans-serif;fill:#64748b}.tiny{font:400 11px Arial,sans-serif;fill:#64748b}.label{font:700 12px Arial,sans-serif;fill:#0f6b78}.white{font:700 14px Arial,sans-serif;fill:#fff}.whiteSmall{font:400 12px Arial,sans-serif;fill:#dce7ef}.boundary{font:700 13px Arial,sans-serif;letter-spacing:1.4px;fill:#2563eb}.rel{font:400 11px Arial,sans-serif;fill:#334155}.tag{font:700 11px Arial,sans-serif;fill:#047857}.source{fill:#f8fafc;stroke:#cbd5e1}.microsoft{fill:#eff6ff;stroke:#7dd3fc}.governed{fill:#ecfdf5;stroke:#34d399}.decision{fill:#f5f3ff;stroke:#a78bfa}.person{fill:#fff7ed;stroke:#fb923c}.control{fill:#0f2e43;stroke:#2d5b72}
    </style>
  </defs>

  <rect width="1600" height="980" rx="26" fill="#f8fafc"/>
  <text x="64" y="62" class="eyebrow">HR1 | STRUCTURIZR-STYLE SYSTEM CONTEXT + CONTAINER VIEW</text>
  <text x="64" y="106" class="title">Governed decisions between enterprise systems</text>
  <text x="64" y="136" class="subtitle">Each source remains authoritative. HR1 validates evidence, stores governed workflow records, and routes decisions to an accountable owner.</text>

  <rect x="54" y="170" width="1492" height="540" rx="18" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/>
  <text x="82" y="205" class="boundary">SYSTEM CONTEXT</text>
  <text x="82" y="230" class="small">Blue boxes are illustrative enterprise adapters; green boxes are the governed Microsoft workflow surfaces.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="275" width="210" height="92" rx="12" class="source"/><text x="197" y="307" text-anchor="middle" class="head">PeopleSoft</text><text x="197" y="329" text-anchor="middle" class="body">Student information system</text><text x="197" y="350" text-anchor="middle" class="tiny">Illustrative REST / integration API</text>
    <rect x="92" y="405" width="210" height="92" rx="12" class="source"/><text x="197" y="437" text-anchor="middle" class="head">Banner</text><text x="197" y="459" text-anchor="middle" class="body">Student information system</text><text x="197" y="480" text-anchor="middle" class="tiny">Illustrative supported API</text>
    <rect x="92" y="535" width="210" height="92" rx="12" class="source"/><text x="197" y="567" text-anchor="middle" class="head">Learning platform</text><text x="197" y="589" text-anchor="middle" class="body">Courses and activity</text><text x="197" y="610" text-anchor="middle" class="tiny">Illustrative REST API</text>
    <rect x="370" y="275" width="210" height="92" rx="12" class="source"/><text x="475" y="307" text-anchor="middle" class="head">CRM</text><text x="475" y="329" text-anchor="middle" class="body">Cases and engagement</text><text x="475" y="350" text-anchor="middle" class="tiny">Illustrative Dataverse API</text>
    <rect x="370" y="405" width="210" height="92" rx="12" class="source"/><text x="475" y="437" text-anchor="middle" class="head">Azure SQL</text><text x="475" y="459" text-anchor="middle" class="body">Crosswalks and metrics</text><text x="475" y="480" text-anchor="middle" class="tiny">Illustrative private endpoint</text>
    <rect x="370" y="535" width="210" height="92" rx="12" class="microsoft"/><text x="475" y="567" text-anchor="middle" class="head">Microsoft Graph</text><text x="475" y="589" text-anchor="middle" class="body">Demo tenant connection</text><text x="475" y="610" text-anchor="middle" class="tag">Read-only prototype surface</text>
  </g>

  <rect x="636" y="245" width="410" height="410" rx="16" fill="#f0f7ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="662" y="277" class="boundary">HR1 INTEGRATION BOUNDARY</text>
  <text x="662" y="302" class="head">Supported adapters and orchestration</text>
  <g filter="url(#shadow)">
    <rect x="666" y="330" width="350" height="70" rx="11" class="microsoft"/><text x="841" y="358" text-anchor="middle" class="head">Azure API Management</text><text x="841" y="380" text-anchor="middle" class="small">Authentication, throttling, approved routes</text>
    <rect x="666" y="420" width="350" height="70" rx="11" class="microsoft"/><text x="841" y="448" text-anchor="middle" class="head">Azure Functions / Power Automate</text><text x="841" y="470" text-anchor="middle" class="small">Validate, normalize, retry, route</text>
    <rect x="666" y="510" width="350" height="70" rx="11" class="decision"/><text x="841" y="538" text-anchor="middle" class="head">Rules-first reconciliation</text><text x="841" y="560" text-anchor="middle" class="small">ID crosswalk, required fields, policy checks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1100" y="275" width="380" height="110" rx="12" class="governed"/><text x="1290" y="309" text-anchor="middle" class="head">SharePoint governed data layer</text><text x="1290" y="333" text-anchor="middle" class="body">Evidence packets, workflow records, audit trail</text><text x="1290" y="356" text-anchor="middle" class="tiny">Data stays in the customer Microsoft 365 tenant</text>
    <rect x="1100" y="425" width="180" height="110" rx="12" class="decision"/><text x="1190" y="458" text-anchor="middle" class="head">AI exception</text><text x="1190" y="480" text-anchor="middle" class="body">Summary only</text><text x="1190" y="502" text-anchor="middle" class="tiny">No autonomous writeback</text>
    <rect x="1300" y="425" width="180" height="110" rx="12" class="person"/><text x="1390" y="458" text-anchor="middle" class="head">Authorized owner</text><text x="1390" y="480" text-anchor="middle" class="body">Accept / reject / escalate</text><text x="1390" y="502" text-anchor="middle" class="tiny">Rationale is recorded</text>
    <rect x="1100" y="575" width="380" height="70" rx="12" class="microsoft"/><text x="1290" y="603" text-anchor="middle" class="head">Graph to Teams / Power BI / Fabric</text><text x="1290" y="625" text-anchor="middle" class="small">Tasks, notifications, and executive reporting</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowMuted)">
    <path d="M302 321H636"/><path d="M302 451H636"/><path d="M302 581H636"/><path d="M580 321H636"/><path d="M580 451H636"/><path d="M580 581H636"/>
  </g>
  <text x="395" y="313" class="rel">records / terms</text><text x="395" y="443" class="rel">enrollment / status</text><text x="395" y="573" class="rel">activity evidence</text>
  <text x="590" y="313" class="rel">cases</text><text x="590" y="443" class="rel">crosswalks</text><text x="590" y="573" class="rel">read-only Graph</text>

  <g stroke="#0f6b78" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M841 400V420"/><path d="M841 490V510"/><path d="M1016 545H1100"/><path d="M1290 385V425"/><path d="M1280 480H1300"/><path d="M1390 535V575"/><path d="M1190 535V575"/>
  </g>
  <text x="854" y="414" class="rel">validated payload</text><text x="854" y="504" class="rel">normalized evidence</text><text x="1028" y="537" class="rel">approved evidence packet</text>
  <text x="1302" y="414" class="rel">review case</text><text x="1279" y="470" class="rel">ambiguous exception</text><text x="1404" y="563" class="rel">task / report</text>

  <rect x="92" y="680" width="1388" height="30" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="786" y="700" text-anchor="middle" class="small">Important relationship: PeopleSoft and Banner do not write directly to SharePoint. HR1 uses approved APIs, validates the evidence, then stores only governed workflow and audit records.</text>

  <rect x="54" y="748" width="1492" height="174" rx="18" fill="#102033"/>
  <text x="82" y="784" class="eyebrow">CROSS-CUTTING CONTROLS</text>
  <text x="82" y="811" class="white">The same controls apply to every relationship in the diagram.</text>
  <g>
    <rect x="82" y="838" width="175" height="50" rx="9" class="control"/><text x="169" y="868" text-anchor="middle" class="whiteSmall">Entra ID + MFA</text>
    <rect x="272" y="838" width="175" height="50" rx="9" class="control"/><text x="359" y="868" text-anchor="middle" class="whiteSmall">RBAC / least privilege</text>
    <rect x="462" y="838" width="175" height="50" rx="9" class="control"/><text x="549" y="868" text-anchor="middle" class="whiteSmall">Key Vault secrets</text>
    <rect x="652" y="838" width="175" height="50" rx="9" class="control"/><text x="739" y="868" text-anchor="middle" class="whiteSmall">Audit + data lineage</text>
    <rect x="842" y="838" width="175" height="50" rx="9" class="control"/><text x="929" y="868" text-anchor="middle" class="whiteSmall">App Insights alerts</text>
    <rect x="1032" y="838" width="175" height="50" rx="9" class="control"/><text x="1119" y="868" text-anchor="middle" class="whiteSmall">FERPA-aware privacy</text>
    <rect x="1222" y="838" width="258" height="50" rx="9" class="control"/><text x="1351" y="860" text-anchor="middle" class="whiteSmall">Source systems remain</text><text x="1351" y="877" text-anchor="middle" class="whiteSmall">authoritative</text>
  </g>
</svg>
