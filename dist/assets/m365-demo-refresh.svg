<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft 365 demo tenant refresh</title>
  <desc id="desc">A portfolio illustration showing successful sign-in, Microsoft Graph, and refreshed read-only data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#126e70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="920" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="790" cy="-20" r="190" fill="#8ee9df" opacity=".1"/>
  <circle cx="80" cy="390" r="190" fill="#f4b24a" opacity=".12"/>
  <text x="42" y="48" fill="#8ee9df" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MICROSOFT 365 CONNECTION</text>
  <text x="42" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Successful demo-tenant refresh</text>
  <g filter="url(#shadow)">
    <rect x="42" y="116" width="250" height="166" rx="16" fill="#fff"/>
    <circle cx="82" cy="157" r="20" fill="#d1fae5"/>
    <path d="M73 157l7 7 13-15" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="153" fill="#102033" font-family="Arial, sans-serif" font-size="15" font-weight="700">Connected</text>
    <text x="116" y="174" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12">Delegated, read only</text>
    <text x="66" y="215" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12">Sign-in</text>
    <text x="66" y="238" fill="#102033" font-family="Arial, sans-serif" font-size="16" font-weight="700">Verified</text>
    <text x="66" y="262" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12">Refresh</text>
    <text x="124" y="262" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="700">Successful</text>
  </g>
  <path d="M320 198h78" stroke="#8ee9df" stroke-width="3" stroke-linecap="round"/>
  <path d="M385 188l15 10-15 10" fill="none" stroke="#8ee9df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="430" y="116" width="448" height="166" rx="16" fill="#fff"/>
    <text x="458" y="151" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MICROSOFT GRAPH</text>
    <text x="458" y="180" fill="#102033" font-family="Arial, sans-serif" font-size="18" font-weight="700">Live read-only data</text>
    <rect x="458" y="202" width="176" height="12" rx="6" fill="#dbeafe"/>
    <rect x="458" y="202" width="142" height="12" rx="6" fill="#2563eb"/>
    <text x="458" y="242" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12">Profile</text>
    <text x="560" y="242" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="700">Available</text>
    <text x="458" y="264" fill="#5f6f84" font-family="Arial, sans-serif" font-size="12">OneDrive metadata</text>
    <text x="620" y="264" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="700">Read only</text>
    <text x="740" y="264" fill="#5f6f84" font-family="Arial, sans-serif" font-size="11">No SIS writeback</text>
  </g>
</svg>
