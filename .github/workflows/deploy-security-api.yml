name: Deploy Security Assurance API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-security-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Pushes require an explicit enable flag; a deliberate manual run is also allowed.
    if: github.event_name == 'workflow_dispatch' || vars.AZURE_SECURITY_API_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --omit=dev --prefix api
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api
