name: Configure Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      origin_ipv4:
        description: Hetzner server public IPv4 address
        required: true
        type: string

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create or update hr1.iavva.ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORIGIN_IPV4: ${{ inputs.origin_ipv4 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in the production environment." >&2
            exit 1
          fi

          if [[ ! "$ORIGIN_IPV4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "origin_ipv4 must be an IPv4 address." >&2
            exit 1
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_response=$(curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=iavva.ai")
          zone_id=$(jq -r 'if .success then .result[0].id // empty else empty end' <<< "$zone_response")
          if [[ -z "$zone_id" ]]; then
            echo "The token cannot read the iavva.ai zone." >&2
            exit 1
          fi

          record_response=$(curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=A&name=hr1.iavva.ai")
          record_id=$(jq -r 'if .success then .result[0].id // empty else empty end' <<< "$record_response")
          payload=$(jq -cn --arg content "$ORIGIN_IPV4" '{type:"A",name:"hr1.iavva.ai",content:$content,ttl:1,proxied:true,comment:"Microsoft AI Integration Workbench on Hetzner"}')

          if [[ -n "$record_id" ]]; then
            result=$(curl --fail-with-body --silent --show-error --request PATCH "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")
            action=updated
          else
            result=$(curl --fail-with-body --silent --show-error --request POST "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")
            action=created
          fi

          if [[ "$(jq -r '.success' <<< "$result")" != "true" ]]; then
            jq -r '.errors[]?.message' <<< "$result" >&2
            exit 1
          fi

          echo "Cloudflare DNS record $action: hr1.iavva.ai → $ORIGIN_IPV4 (proxied, TTL automatic)."
